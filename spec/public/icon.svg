<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="pontoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Background with Safe Margin -->
  <rect width="512" height="512" rx="112" fill="url(#pontoGradient)" />
  <!-- Inner circular badge -->
  <circle cx="256" cy="256" r="190" fill="#ffffff" filter="url(#shadow)" />
  
  <!-- Clock Circle -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="#e2e8f0" stroke-width="12" />
  
  <!-- Hour Markers -->
  <circle cx="256" cy="140" r="6" fill="#1e293b" />
  <circle cx="372" cy="256" r="6" fill="#1e293b" />
  <circle cx="256" cy="372" r="6" fill="#1e293b" />
  <circle cx="140" cy="256" r="6" fill="#1e293b" />

  <!-- Clock Hands -->
  <line x1="256" y1="256" x2="256" y2="175" stroke="#1e3a8a" stroke-width="12" stroke-linecap="round" />
  <line x1="256" y1="256" x2="315" y2="256" stroke="#2563eb" stroke-width="10" stroke-linecap="round" />
  <circle cx="256" cy="256" r="14" fill="#0284c7" />

  <!-- Biometric Verification Arc -->
  <path d="M 175 320 A 105 105 0 0 1 337 320" fill="none" stroke="#10b981" stroke-width="8" stroke-linecap="round" stroke-dasharray="14 10" />
  
  <!-- Checkmark Badge -->
  <circle cx="350" cy="350" r="48" fill="#10b981" filter="url(#shadow)" />
  <path d="M 334 350 L 344 360 L 366 338" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
</svg>
